name: Build RKS Calculator APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # runner 不自带 gradle 命令
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.8.0'

    # setup-android 没有 api-level 输入项，必须用 packages 指定
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-37.0 platform-tools'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 9.8.0

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    # AGP 9 输出名可能与旧版不同，动态查找避免写死路径
    - name: Locate APK
      id: locate
      run: |
        find app/build/outputs -type f -name '*.apk' -exec ls -l {} \;
        APK=$(find app/build/outputs -type f -name '*.apk' | head -1)
        if [ -z "$APK" ]; then
          echo "::error::没有找到 APK 产物"
          exit 1
        fi
        echo "APK_PATH=$APK" >> "$GITHUB_ENV"
        echo "找到 APK：$APK"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RKS-Calculator-Debug-APK
        path: ${{ env.APK_PATH }}
        if-no-files-found: error
